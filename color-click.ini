; color-click.ahk 配置文件
; 颜色写 0xRRGGBB（和脚本取到的颜色一致），-1 = 未标定
; 坐标写「窗口客户区百分比」数值（0-100），
;   例：RX=50 表示客户区宽度的一半；RY=90 表示靠下的位置
; 用 pick-relative.ahk 标定，脚本运行时按当前窗口大小实时换算
; 改完在脚本里按 Ctrl+Alt+0 重新载入，或按 F1 重开

; ─── 运行方式 ───
; 取色方式：后台 = 抓窗口画面（窗口被盖住也能用；开隐形模式后更稳）
;           屏幕 = 从屏幕取色（窗口必须在最前；隐形模式开着时会被强制改回后台）
取色方式=后台
; 点击方式：消息 = 发鼠标消息，不抢焦点、不动真实光标
;           前台 = 把窗口拉到前台真实点击，点完还原你原来在用的窗口
点击方式=消息
; ★ 隐形模式：1 = 把游戏窗口设成「全透明 + 鼠标穿透 + 置顶」
;     效果：你在屏幕上完全看不见它，它也不挡你点别的东西；
;           但它对 Chromium 来说始终「在屏幕上、没被遮挡」，画面一直渲染。
;           于是切窗口、开全屏程序、最小化都不会掉监测，
;           也不会再自动把小游戏弹到前台。
;     想临时看一眼游戏，按 Ctrl+Alt+I 显形，再按一次重新隐形。
;   0 = 关掉（想全程看着游戏画面时用，这时窗口会露在最前面）
隐形模式=1
; 仅「前台」点击模式有效：1 = 点完把原来那个窗口还原到前台
点击后还原=1
; 窗口被最小化时自动还原（最小化状态抓不到画面）。
;   隐形模式开着时：还原过程你看不见，放心开
;   隐形模式关着时：会看到窗口自己弹出来
最小化自动还原=1
; 挂边模式露出宽度（像素）—— 备用方案，一般用不到。
;   Ctrl+Alt+H 把窗口挪到屏幕右缘只露这几像素并置顶，避免被完全遮挡
挂边宽度=6

; ─── 监控日志窗口 ───
; Ctrl+Alt+L 显示 / 隐藏。窗口可以拖动、缩放，位置会自动存回这里
日志位置X=20
日志位置Y=20

; ─── 通用 ───
检查间隔=1000
点击后等待=800
最大点击数=0
颜色容差=12
触发模式=edge
; 仅「屏幕」取色方式有效：1 = 窗口不在最前面就暂停
要求窗口激活=0
目标窗口=小游戏 ahk_exe douyin.exe

规则数=4

